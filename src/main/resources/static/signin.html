<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusMarket | Sign In</title>

    <link rel="stylesheet" href="/css/styles.css">

    <script
            async
            crossorigin="anonymous"
            data-clerk-publishable-key="pk_test_ZnVubnktbXVza294LTU5LmNsZXJrLmFjY291bnRzLmRldiQ"
            src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@4/dist/clerk.browser.js">
    </script>
</head>
<body>

<div class="container">

    <h1>CampusMarket</h1>

    <div id="sign-in"></div>

</div>

<script>

    window.addEventListener("load", async () => {

        await Clerk.load();

        if (Clerk.user) {

            window.location.href = "/";

            return;
        }

        Clerk.mountSignIn(
            document.getElementById("sign-in"),
            {
                routing: "path",

                path: "/sign-in",

                signUpUrl: "/sign-up",

                afterSignInUrl: "/dashboard",

                appearance: {
                    elements: {
                        card: {
                            boxShadow: "0 10px 25px rgba(0,0,0,0.1)",
                            borderRadius: "12px"
                        }
                    }
                }
            }
        );

    });

</script>

</body>
</html>
