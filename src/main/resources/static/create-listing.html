<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusMarket | Vender Producto</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script async crossorigin="anonymous"
        data-clerk-publishable-key="pk_test_ZnVubnktbXVza294LTU5LmNsZXJrLmFjY291bnRzLmRldiQ"
        src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@4/dist/clerk.browser.js">
        </script>
</head>

<body>

    <div class="container">
        <button onclick="window.location.href='/dashboard.html'"
            style="margin-bottom: 20px; border: 1px solid #370d0d; padding: 5px 10px; cursor:pointer;">
            Volver al Dashboard
        </button>

        <h1>Vender un Producto</h1>

        <div style="background: #eef; padding: 20px; border-radius: 8px;">
            <form id="create-listing-form">
                <label style="font-weight: bold;">Título</label>
                <input type="text" id="listing-title" placeholder="ej. Laptop HP Core i5" required
                    style="display:block; margin-bottom: 15px; width: 100%; padding: 8px; box-sizing: border-box;">

                <label style="font-weight: bold;">Descripción</label>
                <textarea id="listing-desc" placeholder="Detalla el estado de tu producto..." required
                    style="display:block; margin-bottom: 15px; width: 100%; padding: 8px; box-sizing: border-box; height: 100px;"></textarea>

                <label style="font-weight: bold;">Precio ($)</label>
                <input type="number" id="listing-price" placeholder="0.00" step="0.01" required
                    style="display:block; margin-bottom: 15px; width: 100%; padding: 8px; box-sizing: border-box;">

                <label style="font-weight: bold;">Categoría</label>
                <select id="listing-category" required
                    style="display:block; margin-bottom: 20px; width: 100%; padding: 8px; box-sizing: border-box;">
                    <option value="" disabled selected>Selecciona una categoría...</option>
                    <option value="123e4567-e89b-12d3-a456-426614174001">Libros y Apuntes</option>
                    <option value="123e4567-e89b-12d3-a456-426614174002">Electrónica</option>
                    <option value="123e4567-e89b-12d3-a456-426614174003">Tutorías</option>
                    <option value="123e4567-e89b-12d3-a456-426614174004">Insumos Universitarios</option>
                </select>

                <button type="submit"
                    style="background: #007bff; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%;">
                    Publicar (Borrador)
                </button>
            </form>
        </div>
    </div>

    <script>

        window.addEventListener("load", async () => {
            await Clerk.load();
            if (!Clerk.user) {
                window.location.href = "/signin.html";
                return;
            }
        });
    </script>

    <script src="/js/create-listing.js"></script>

</body>

</html>
