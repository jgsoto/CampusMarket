<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusMarket | Mi Perfil</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container" style="max-width: 600px; margin: auto; padding: 20px;">
        <h1 style="text-align: center;">Mi Perfil</h1>

        <button onclick="window.location.href='/dashboard.html'"
            style="background: #6c757d; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 20px;">
            ← Volver
        </button>

        <form id="profile-form" style="display: flex; flex-direction: column; gap: 15px; background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #ccc;">
            
            <div>
                <label>Nombre:</label>
                <input type="text" id="prof-name" disabled style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; background: #e9ecef;">
            </div>

            <div>
                <label>Email:</label>
                <input type="text" id="prof-email" disabled style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; background: #e9ecef;">
            </div>

            <div>
                <label>Teléfono (Whatsapp):</label>
                <input type="text" id="prof-phone" placeholder="Ej: 0991234567" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
            </div>

            <div>
                <label>Dirección / Sector:</label>
                <input type="text" id="prof-address" placeholder="Ej: Sector La Gasca" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
            </div>

            <div>
                <label>Redes Sociales (Opcional):</label>
                <input type="text" id="prof-social" placeholder="Link a Facebook, Instagram..." style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
            </div>

            <div>
                <label>Sobre ti:</label>
                <textarea id="prof-desc" placeholder="Soy estudiante de..." rows="4" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; resize: vertical;"></textarea>
            </div>

            <button type="submit" style="background: #007bff; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px;">
                Guardar Cambios
            </button>
        </form>
    </div>

    <script src="/modules/identity/js/profile.js"></script>
</body>
</html>
