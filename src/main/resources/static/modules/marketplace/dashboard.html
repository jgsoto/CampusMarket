<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusMarket | Catálogo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/styles.css" />
  <script async crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_ZnVubnktbXVza294LTU5LmNsZXJrLmFjY291bnRzLmRldiQ"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js/dist/clerk.browser.js">
    </script>
</head>

<body class="bg-gray-50 min-h-screen">

  <div id="navbar-placeholder"></div>

  <main class="max-w-6xl mx-auto px-6 py-8">

      <div id="user-section" class="flex items-center gap-4 mb-8">

          <div
                  class="w-12 h-12 rounded-full border-2 border-uce-gold overflow-hidden flex items-center justify-center flex-shrink-0">

              <img
                      id="user-photo"
                      class="hidden w-full h-full object-cover"
                      alt="Foto de perfil">

              <div
                      id="user-avatar"
                      class="w-full h-full bg-gradient-to-br from-uce-navy to-uce-navy-light flex items-center justify-center">

            <span
                    id="user-initials"
                    class="font-display text-base font-bold text-uce-gold">
            </span>

              </div>

          </div>

          <div>
              <h1 class="font-display text-2xl font-bold text-uce-navy leading-tight">
                  Bienvenido,
                  <span id="user-name" class="text-uce-gold"></span>
              </h1>

              <p id="user-email" class="text-sm text-gray-400"></p>
          </div>

      </div>

    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-8">
      <div>
        <h2 class="font-display text-3xl font-bold text-uce-navy">Catálogo de Productos</h2>
        <p class="text-sm text-gray-400 mt-1">Encuentra lo que necesitas en tu comunidad UCE</p>
      </div>
      <a href="/modules/marketplace/create-listing.html"
        class="inline-flex items-center gap-2 bg-uce-navy text-uce-gold font-bold text-sm px-5 py-3 rounded-xl hover:bg-uce-navy-light transition-all shadow-sm w-fit">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
          aria-hidden="true">
          <path d="M12 5v14M5 12h14" />
        </svg>
        PUBLICAR PRODUCTO
      </a>
    </div>

    <div
      class="bg-white border border-gray-100 p-4 rounded-2xl shadow-sm mb-8 flex flex-col sm:flex-row gap-3 items-stretch sm:items-center">
      <div class="relative flex-1">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input id="search-input" type="search" placeholder="Buscar por nombre o descripción..."
          class="w-full pl-9 pr-4 py-2.5 text-sm border-2 border-gray-100 rounded-xl focus:border-uce-navy focus:outline-none transition-colors" />
      </div>
      <div class="flex gap-2 flex-wrap">
        <button data-filter="TODOS"
          class="filter-btn px-4 py-2 text-xs font-semibold rounded-xl border-2 transition-all bg-uce-navy text-uce-gold border-uce-navy">Todos</button>
        <button data-filter="PUBLICADA"
          class="filter-btn px-4 py-2 text-xs font-semibold rounded-xl border-2 transition-all bg-white text-gray-500 border-gray-200 hover:bg-gray-50">Disponibles</button>
        <button data-filter="VENDIDO"
          class="filter-btn px-4 py-2 text-xs font-semibold rounded-xl border-2 transition-all bg-white text-gray-500 border-gray-200 hover:bg-gray-50">Vendidos</button>
      </div>
    </div>

    <div class="mb-6 w-full sm:w-1/3">
      <div class="relative">
        <select id="category-select"
          class="w-full pl-4 pr-10 py-2.5 text-sm font-semibold text-gray-700 border-2 border-gray-100 rounded-xl focus:border-uce-navy focus:outline-none transition-colors appearance-none bg-white cursor-pointer shadow-sm">
          <option value="TODAS">Todas las Categorías</option>
        </select>
        <svg class="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none" fill="none"
          stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </div>
    </div>


    <div id="catalog-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <div class="skeleton rounded-2xl h-72"></div>
      <div class="skeleton rounded-2xl h-72"></div>
      <div class="skeleton rounded-2xl h-72"></div>
      <div class="skeleton rounded-2xl h-72"></div>
    </div>

  </main>

  <script src="/modules/shared/components/js/marketplace-layout.js"></script>
  <script src="/modules/marketplace/js/marketplace.js"></script>
  <script src="/modules/marketplace/js/dashboard.js"></script>

</body>

</html>
