<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CampusMarket | Mis Publicaciones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="/css/styles.css"/>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script async crossorigin="anonymous"
            data-clerk-publishable-key="pk_test_ZnVubnktbXVza294LTU5LmNsZXJrLmFjY291bnRzLmRldiQ"
            src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js/dist/clerk.browser.js">
    </script>
</head>
<body class="bg-gray-50 min-h-screen">

<div id="navbar-placeholder"></div>

<main class="max-w-6xl mx-auto px-6 py-8 pb-20">

    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
        <div>
            <h1 class="font-display text-3xl font-bold text-uce-navy">Mis Publicaciones</h1>
            <p class="text-sm text-gray-400 mt-1">Gestiona tus productos en venta y ofertas académicas desde un solo
                lugar.</p>
        </div>
        <a id="btn-new-publication" href="/modules/marketplace/create-listing.html"
           class="inline-flex items-center gap-2 bg-uce-navy text-uce-gold font-bold text-sm px-5 py-3 rounded-xl hover:bg-uce-navy-light transition-colors shadow-sm w-fit">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                 aria-hidden="true">
                <path d="M12 5v14M5 12h14"/>
            </svg>
            Nueva publicación
        </a>
    </div>

    <div class="flex border-b border-gray-200 mb-8 gap-2">
        <button id="tab-products"
                class="px-6 py-3 text-sm font-bold border-b-2 border-uce-navy text-uce-navy transition-all">
            Productos en Venta
        </button>
        <button id="tab-tutoring"
                class="px-6 py-3 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-uce-navy transition-all">
            Mis Tutorías
        </button>
        <button id="tab-resources"
                class="px-6 py-3 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-uce-navy transition-all">
            Mis Recursos
        </button>
    </div>

    <section id="section-products" class="block">
        <div id="my-listings-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div class="skeleton rounded-2xl h-80"></div>
            <div class="skeleton rounded-2xl h-80"></div>
            <div class="skeleton rounded-2xl h-80"></div>
        </div>
    </section>

    <section id="section-tutoring" class="hidden">
        <div id="my-tutoring-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
            <div class="skeleton rounded-2xl h-52"></div>
            <div class="skeleton rounded-2xl h-52"></div>
        </div>
    </section>

    <section id="section-resources" class="hidden">
        <div id="my-resources-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <div class="skeleton rounded-2xl h-80"></div>
            <div class="skeleton rounded-2xl h-80"></div>
        </div>
    </section>

</main>



<div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 max-w-sm" aria-live="polite"></div>

<script src="/modules/shared/components/js/marketplace-layout.js"></script>
<script src="/modules/marketplace/js/my-listings.js"></script>
</body>
</html>
