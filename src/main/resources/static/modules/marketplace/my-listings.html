<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusMarket | Mis Publicaciones</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script async crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_ZnVubnktbXVza294LTU5LmNsZXJrLmFjY291bnRzLmRldiQ"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@4/dist/clerk.browser.js">
  </script>
</head>
<body class="bg-gray-50 min-h-screen">

  <div id="navbar-placeholder"></div>

  <main class="max-w-6xl mx-auto px-6 py-8 pb-20">

    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
      <div>
        <h1 class="font-display text-3xl font-bold text-uce-navy">Mis Publicaciones</h1>
        <p class="text-sm text-gray-400 mt-1">Gestiona tus productos en venta y ofertas académicas desde un solo lugar.</p>
      </div>
      <a id="btn-new-publication" href="/modules/marketplace/create-listing.html"
         class="inline-flex items-center gap-2 bg-uce-navy text-uce-gold font-bold text-sm px-5 py-3 rounded-xl hover:bg-uce-navy-light transition-colors shadow-sm w-fit">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Nueva publicación
      </a>
    </div>

    <div class="flex border-b border-gray-200 mb-8 gap-2">
      <button id="tab-products" class="px-6 py-3 text-sm font-bold border-b-2 border-uce-navy text-uce-navy transition-all">
      Productos en Venta
      </button>
      <button id="tab-tutoring" class="px-6 py-3 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-uce-navy transition-all">
      Mis Tutorías
      </button>
    </div>

    <section id="section-products" class="block">
      <div id="my-listings-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <div class="skeleton rounded-2xl h-80"></div>
        <div class="skeleton rounded-2xl h-80"></div>
        <div class="skeleton rounded-2xl h-80"></div>
      </div>
    </section>

    <section id="section-tutoring" class="hidden">
      <div id="my-tutoring-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
        <div class="skeleton rounded-2xl h-52"></div>
        <div class="skeleton rounded-2xl h-52"></div>
      </div>
    </section>

  </main>

  <div id="edit-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 flex flex-col gap-5">
      <div class="flex items-center justify-between">
        <h2 id="modal-title" class="font-display text-xl font-bold text-uce-navy">Editar publicación</h2>
        <button onclick="closeEditModal()" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center transition-colors" aria-label="Cerrar modal">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <form id="edit-listing-form" class="flex flex-col gap-4" novalidate>
        <input type="hidden" id="edit-id" />

        <div class="flex flex-col gap-1.5">
          <label class="text-sm font-medium text-gray-700" for="edit-title">Título</label>
          <input id="edit-title" type="text" required class="px-4 py-3 border-2 border-gray-200 rounded-xl text-sm focus:border-uce-navy focus:outline-none transition-colors" />
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-sm font-medium text-gray-700" for="edit-desc">Descripción</label>
          <textarea id="edit-desc" rows="3" required class="px-4 py-3 border-2 border-gray-200 rounded-xl text-sm focus:border-uce-navy focus:outline-none transition-colors resize-none"></textarea>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-sm font-medium text-gray-700" for="edit-price">Precio (USD)</label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm">$</span>
            <input id="edit-price" type="number" step="0.01" min="0.01" required class="w-full pl-8 pr-4 py-3 border-2 border-gray-200 rounded-xl text-sm focus:border-uce-navy focus:outline-none transition-colors" />
          </div>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-sm font-medium text-gray-700" for="edit-images">
            Imágenes <span class="text-xs text-gray-400 font-normal ml-1">(opcional — reemplaza las anteriores)</span>
          </label>
          <input id="edit-images" type="file" multiple accept="image/*" class="text-sm text-gray-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-gray-100 file:text-gray-700 hover:file:bg-gray-200 transition-colors cursor-pointer" />
        </div>

        <div class="flex gap-3 pt-2 border-t border-gray-100">
          <button type="button" onclick="closeEditModal()" class="flex-1 py-3 rounded-xl text-sm font-medium border-2 border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors">
            Cancelar
          </button>
          <button type="submit" class="flex-1 py-3 rounded-xl text-sm font-bold bg-uce-navy text-uce-gold hover:bg-uce-navy-light transition-colors">
            Guardar cambios
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 max-w-sm" aria-live="polite"></div>

  <script src="/modules/shared/components/js/marketplace-layout.js"></script>
  <script src="/modules/marketplace/js/my-listings.js"></script>
</body>
</html>
