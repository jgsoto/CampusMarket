<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusMarket | Mis Publicaciones</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script async crossorigin="anonymous"
            data-clerk-publishable-key="pk_test_ZnVubnktbXVza294LTU5LmNsZXJrLmFjY291bnRzLmRldiQ"
            src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@4/dist/clerk.browser.js">
    </script>
</head>
<body>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Mis Publicaciones</h1>
            <div>
                <button onclick="window.location.href='/modules/marketplace/dashboard.html'" style="background: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 10px;">
                    Volver al Catalogo
                </button>
                <button onclick="window.location.href='/modules/marketplace/create-listing.html'" style="background: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
                    + Nueva Publicacion
                </button>
            </div>
        </div>

        <hr style="margin: 20px 0;">

        <div id="my-listings-container" style="display: flex; gap: 15px; flex-wrap: wrap;">
            <p>Cargando tus publicaciones...</p>
        </div>
    </div>

    <div id="edit-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center;">
        <div style="background: white; padding: 20px; border-radius: 8px; width: 400px; max-width: 90%;">
            <h2>Editar Publicacion</h2>
            <form id="edit-listing-form">
                <input type="hidden" id="edit-id">
                <div style="margin-bottom: 15px;">
                    <label>Titulo:</label><br>
                    <input type="text" id="edit-title" required style="width: 100%; padding: 8px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label>Descripcion:</label><br>
                    <textarea id="edit-desc" required style="width: 100%; padding: 8px; height: 100px;"></textarea>
                </div>
                <div style="margin-bottom: 15px;">
                    <label>Precio:</label><br>
                    <input type="number" id="edit-price" step="0.01" required style="width: 100%; padding: 8px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label>Imagenes (Opcional - Reemplaza las anteriores):</label><br>
                    <input type="file" id="edit-images" multiple accept="image/*" style="width: 100%; padding: 8px;">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" onclick="closeEditModal()" style="padding: 8px 15px; cursor: pointer;">Cancelar</button>
                    <button type="submit" style="background: #ffc107; color: black; padding: 8px 15px; border: none; font-weight: bold; cursor: pointer;">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/modules/marketplace/js/my-listings.js"></script>

</body>
</html>
