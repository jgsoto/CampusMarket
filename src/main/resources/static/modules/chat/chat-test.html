<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chat Test</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin:auto;
            padding:20px;
        }

        section{
            border:1px solid #ddd;
            padding:20px;
            margin-bottom:20px;
            border-radius:10px;
        }

        input, textarea{
            width:100%;
            padding:8px;
            margin-top:5px;
            margin-bottom:10px;
        }

        button{
            padding:10px;
            cursor:pointer;
        }

        pre{
            background:#f5f5f5;
            padding:10px;
            overflow:auto;
        }
    </style>
</head>
<body>

<h1>CampusMarket Chat Test</h1>

<section>

    <h2>Usuario actual</h2>

    <input
            id="userId"
            placeholder="X-User-Id"
    >

</section>

<section>

    <h2>Crear Conversación</h2>

    <input
            id="listingId"
            placeholder="Listing Id"
    >

    <input
            id="sellerId"
            placeholder="Seller Id"
    >

    <button onclick="createConversation()">
        Crear
    </button>

</section>

<section>

    <h2>Mis Conversaciones</h2>

    <button onclick="loadConversations()">
        Cargar
    </button>

    <pre id="conversations"></pre>

</section>

<section>

    <h2>Mensajes</h2>

    <input
            id="conversationId"
            placeholder="Conversation Id"
    >

    <button onclick="loadMessages()">
        Ver Mensajes
    </button>

    <pre id="messages"></pre>

</section>

<section>

    <h2>Enviar Mensaje</h2>

    <textarea
            id="content"
            placeholder="Mensaje..."
    ></textarea>

    <button onclick="sendMessage()">
        Enviar
    </button>

</section>

<script src="js/chat-test.js"></script>

</body>
</html>
