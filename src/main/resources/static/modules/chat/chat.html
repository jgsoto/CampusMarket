<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Conversación</title>
</head>
<body>

<h2>Mensajes</h2>

<div id="messages"></div>

<hr>

<input
        type="text"
        id="content"
        placeholder="Escribe un mensaje"
/>

<button onclick="sendMessage()">
    Enviar
</button>

<script>

    const API = "http://localhost:8080";

    const USER_ID =
        localStorage.getItem("campusMarketUserId");

    const params =
        new URLSearchParams(window.location.search);

    const conversationId =
        params.get("id");

    async function loadMessages() {

        try {

            const response = await fetch(
                `${API}/api/chat/conversations/${conversationId}/messages`
            );

            if (!response.ok) {
                throw new Error("Error al cargar mensajes");
            }

            const messages =
                await response.json();

            const div =
                document.getElementById("messages");

            div.innerHTML = "";

            messages.forEach(m => {

                const sender =
                    m.senderId === USER_ID
                        ? "Yo"
                        : "Otro usuario";

                div.innerHTML += `
                    <p>
                        <b>${sender}</b>:
                        ${m.content}
                    </p>
                `;
            });

        } catch (error) {

            console.error(error);

            document.getElementById("messages").innerHTML =
                "<p>Error al cargar mensajes.</p>";
        }
    }

    async function sendMessage() {

        const input =
            document.getElementById("content");

        const content =
            input.value.trim();

        if (!content) {
            return;
        }

        try {

            const response = await fetch(
                `${API}/api/chat/conversations/${conversationId}/messages`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-User-Id": USER_ID
                    },
                    body: JSON.stringify({
                        content: content
                    })
                }
            );

            if (!response.ok) {
                throw new Error("Error al enviar mensaje");
            }

            input.value = "";

            await loadMessages();

        } catch (error) {

            console.error(error);

            alert("No se pudo enviar el mensaje.");
        }
    }

    loadMessages();

    setInterval(loadMessages, 3000);

</script>

</body>
</html>
