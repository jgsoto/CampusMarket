<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CampusMarket | Detalle de Tutoría</title>
    <link rel="icon" type="image/png" href="/assets/icons/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tailwind-config.js"></script>
    <link rel="stylesheet" href="/css/styles.css"/>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script async crossorigin="anonymous"
            data-clerk-publishable-key="pk_test_ZnVubnktbXVza294LTU5LmNsZXJrLmFjY291bnRzLmRldiQ"
            src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js/dist/clerk.browser.js">
    </script>
    <style>
        .star-btn {
            transition: color .15s, transform .15s;
            cursor: pointer;
        }

        .star-btn:hover, .star-btn.selected {
            color: #f59e0b;
            transform: scale(1.15);
        }

        .review-card {
            transition: box-shadow .2s;
        }

        .review-card:hover {
            box-shadow: 0 4px 16px rgba(10, 22, 40, .07);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

<div id="navbar-placeholder"></div>

<main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 pb-20">

    <nav class="flex items-center gap-2 text-sm text-gray-400 mb-6">
        <a href="/modules/marketplace/dashboard.html" class="hover:text-uce-navy transition-colors">Dashboard</a>
        <span class="text-gray-300">›</span>
        <a href="/modules/tutoring/tutoring-catalog.html" class="hover:text-uce-navy transition-colors">Tutorías</a>
        <span class="text-gray-300">›</span>
        <span id="breadcrumb-subject" class="text-gray-700 font-medium truncate max-w-[160px]" aria-current="page">Detalle</span>
    </nav>

    <div id="page-loading" class="grid grid-cols-1 lg:grid-cols-[1fr_320px] gap-8">
        <div class="flex flex-col gap-4">
            <div class="skeleton-blink h-10 w-2/3 rounded-xl"></div>
            <div class="skeleton-blink h-6 w-1/4 rounded-xl"></div>
            <div class="skeleton-blink h-32 rounded-2xl"></div>
            <div class="skeleton-blink h-48 rounded-2xl"></div>
        </div>
        <div class="skeleton-blink rounded-2xl h-72"></div>
    </div>

    <div id="page-content" class="hidden grid grid-cols-1 lg:grid-cols-[1fr_320px] gap-8">

        <div class="flex flex-col gap-6">

            <div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm">
                <div class="flex flex-wrap items-start justify-between gap-3 mb-3">
                    <h1 id="tutoring-subject" class="font-display text-2xl font-black text-uce-navy leading-tight">—</h1>
                    <span id="status-badge" class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">—</span>
                </div>
                <p id="tutoring-price" class="text-xl font-bold text-emerald-600 mb-4">—</p>
                <p id="tutoring-description" class="text-gray-600 text-sm leading-relaxed">—</p>
            </div>

            <div id="review-section" class="hidden bg-white border border-uce-gold/30 rounded-2xl p-6 shadow-sm">
                <h2 class="font-display text-base font-bold text-uce-navy mb-4">Dejar una reseña</h2>
                <form id="review-form" class="flex flex-col gap-4" novalidate>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-sm font-medium text-gray-700">Calificación <span class="text-red-400">*</span></label>
                        <div class="flex gap-2" id="star-rating" role="group" aria-label="Selecciona una calificación">
                            <button type="button" class="star-btn text-gray-300 text-2xl" data-value="1" aria-label="1 estrella">★</button>
                            <button type="button" class="star-btn text-gray-300 text-2xl" data-value="2" aria-label="2 estrellas">★</button>
                            <button type="button" class="star-btn text-gray-300 text-2xl" data-value="3" aria-label="3 estrellas">★</button>
                            <button type="button" class="star-btn text-gray-300 text-2xl" data-value="4" aria-label="4 estrellas">★</button>
                            <button type="button" class="star-btn text-gray-300 text-2xl" data-value="5" aria-label="5 estrellas">★</button>
                        </div>
                        <input type="hidden" id="review-rating" value=""/>
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-sm font-medium text-gray-700" for="review-comment">
                            Comentario <span class="text-red-400">*</span>
                        </label>
                        <textarea id="review-comment" rows="3" maxlength="300" placeholder="Describe tu experiencia con el tutor..." class="px-4 py-3 border-2 border-gray-200 rounded-xl text-sm focus:border-uce-navy focus:outline-none transition-colors resize-none"></textarea>
                    </div>
                    <div class="flex justify-end">
                        <button type="submit" class="flex items-center gap-2 px-6 py-2.5 bg-uce-navy text-uce-gold font-bold text-xs uppercase tracking-wider rounded-xl hover:bg-uce-navy-light transition-all shadow-sm">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                                <path d="M22 2L11 13"/>
                                <path d="M22 2L15 22 11 13 2 9l20-7z"/>
                            </svg>
                            Enviar reseña
                        </button>
                    </div>
                </form>
            </div>

            <div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm">
                <h2 id="reviews-title" class="font-display text-base font-bold text-uce-navy mb-4">Opiniones (0)</h2>
                <div id="reviews-container" class="flex flex-col gap-3"></div>
            </div>

            <div id="owner-actions" class="hidden bg-white border border-red-100 rounded-2xl p-6 shadow-sm">
                <p class="text-[10px] font-bold uppercase tracking-widest text-gray-400 mb-3">Esta es tu publicación</p>
                <p class="text-sm text-gray-500 mb-4">Gestiona tu oferta académica desde aquí.</p>
                <div class="flex flex-wrap gap-3">
                    <button id="edit-offer-btn" class="flex items-center gap-2 px-5 py-2.5 bg-amber-500 text-white font-bold text-xs uppercase tracking-wider rounded-xl hover:bg-amber-600 transition-all shadow-sm">
                        🎨 Editar Tutoría
                    </button>
                    <button id="close-offer-btn" class="flex items-center gap-2 px-5 py-2.5 bg-gray-500 text-white font-bold text-xs uppercase tracking-wider rounded-xl hover:bg-gray-600 transition-all shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="15" y1="9" x2="9" y2="15"/>
                            <line x1="9" y1="9" x2="15" y2="15"/>
                        </svg>
                        Marcar como Cerrada
                    </button>
                    <button id="delete-offer-btn" class="flex items-center gap-2 px-5 py-2.5 bg-red-600 text-white font-bold text-xs uppercase tracking-wider rounded-xl hover:bg-red-700 transition-all shadow-sm">
                        🗑️ Eliminar Tutoría
                    </button>
                </div>
                <div id="students-panel" class="mt-6">
                    <h3 class="font-bold text-lg mb-3">Estudiantes inscritos</h3>
                    <div id="enrolled-students" class="flex flex-col gap-2"></div>
                </div>
            </div>

        </div>

        <aside class="flex flex-col gap-5 lg:sticky lg:top-24">

            <div id="enroll-container" class="w-full"></div>

            <div id="contact-panel"></div>

            <div id="owner-note" class="hidden bg-amber-50 border border-amber-200 rounded-2xl p-4 text-sm text-amber-800 font-medium text-center">
                Estás viendo tu propia publicación.
            </div>

        </aside>
    </div>

</main>

<div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 max-w-sm" aria-live="polite"></div>

<script src="/modules/shared/components/js/marketplace-layout.js"></script>
<script src="/modules/tutoring/js/tutoring-details.js"></script>
</body>
</html>
