<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusMarket | Mis Compras</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script async crossorigin="anonymous"
        data-clerk-publishable-key="pk_test_ZnVubnktbXVza294LTU5LmNsZXJrLmFjY291bnRzLmRldiQ"
        src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@4/dist/clerk.browser.js">
    </script>
    <style>
        .orders-page { max-width: 900px; margin: 0 auto; padding: 30px 20px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .page-header h1 { margin: 0; font-size: 1.8rem; }
        .btn-back {
            background: #007bff; color: white; padding: 10px 18px;
            border: none; border-radius: 6px; cursor: pointer; font-weight: bold; text-decoration: none;
        }
        .btn-back:hover { background: #0056b3; }
        .orders-empty {
            text-align: center; padding: 60px 20px;
            color: #888; font-size: 1.1rem;
        }
        .orders-empty span { font-size: 3rem; display: block; margin-bottom: 15px; }
        .order-card {
            background: #fff; border: 1px solid #e0e0e0; border-radius: 10px;
            padding: 20px 25px; margin-bottom: 18px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            display: flex; justify-content: space-between; align-items: center; gap: 20px;
        }
        .order-info h3 { margin: 0 0 6px 0; font-size: 1.1rem; color: #222; }
        .order-info p { margin: 2px 0; font-size: 0.88rem; color: #666; }
        .order-amount { font-size: 1.4rem; font-weight: bold; color: #28a745; white-space: nowrap; }
        .btn-invoice {
            background: #6f42c1; color: white; border: none; padding: 9px 16px;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem;
            white-space: nowrap;
        }
        .btn-invoice:hover { background: #563d7c; }

        /* Modal de factura */
        #invoice-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .invoice-box {
            background: white; width: 480px; max-width: 95%; border-radius: 12px;
            padding: 35px 40px; position: relative; font-family: 'Courier New', monospace;
        }
        .invoice-box .close-btn {
            position: absolute; top: 12px; right: 16px; font-size: 1.4rem;
            background: none; border: none; cursor: pointer; color: #555;
        }
        .invoice-header { text-align: center; border-bottom: 2px dashed #ccc; padding-bottom: 18px; margin-bottom: 18px; }
        .invoice-header h2 { margin: 0 0 4px; font-size: 1.4rem; letter-spacing: 1px; }
        .invoice-header p { margin: 0; font-size: 0.8rem; color: #888; }
        .invoice-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.92rem; }
        .invoice-row .label { color: #555; }
        .invoice-row .value { font-weight: bold; color: #222; text-align: right; max-width: 60%; word-break: break-all; }
        .invoice-total {
            border-top: 2px dashed #ccc; margin-top: 18px; padding-top: 14px;
            display: flex; justify-content: space-between; font-size: 1.15rem; font-weight: bold;
        }
        .invoice-total .total-amount { color: #28a745; }
        .invoice-footer { text-align: center; margin-top: 20px; font-size: 0.78rem; color: #aaa; }
        .badge-success {
            display: inline-block; background: #d4edda; color: #155724;
            padding: 3px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold;
        }
        @media print {
            body > *:not(#invoice-modal) { display: none !important; }
            #invoice-modal { display: flex !important; background: white; }
            .close-btn, .btn-print { display: none !important; }
        }
    </style>
</head>
<body>

    <div class="orders-page">
        <div class="page-header">
            <h1>🛒 Mis Compras</h1>
            <button class="btn-back" onclick="window.location.href='/dashboard.html'">← Volver al Dashboard</button>
        </div>

        <div id="orders-container">
            <p style="color:#888;">Cargando tus compras...</p>
        </div>
    </div>

    <!-- Modal Factura -->
    <div id="invoice-modal">
        <div class="invoice-box">
            <button class="close-btn" onclick="closeInvoice()">✕</button>

            <div class="invoice-header">
                <h2>🎓 CampusMarket</h2>
                <p>Comprobante de Compra</p>
            </div>

            <div class="invoice-row">
                <span class="label">N° Orden:</span>
                <span class="value" id="inv-id"></span>
            </div>
            <div class="invoice-row">
                <span class="label">Fecha:</span>
                <span class="value" id="inv-date"></span>
            </div>
            <div class="invoice-row">
                <span class="label">Producto:</span>
                <span class="value" id="inv-product"></span>
            </div>
            <div class="invoice-row">
                <span class="label">ID Pago:</span>
                <span class="value" id="inv-payment"></span>
            </div>
            <div class="invoice-row">
                <span class="label">Estado:</span>
                <span class="value"><span class="badge-success">✅ Completado</span></span>
            </div>

            <div class="invoice-total">
                <span>Total Pagado:</span>
                <span class="total-amount" id="inv-amount"></span>
            </div>

            <div class="invoice-footer">
                <p>Gracias por tu compra en CampusMarket</p>
                <p>Universidad Central del Ecuador</p>
                <button class="btn-invoice" id="btn-print" onclick="window.print()" style="margin-top: 12px;">🖨️ Imprimir</button>
            </div>
        </div>
    </div>

    <script src="/js/my-orders.js"></script>

</body>
</html>
