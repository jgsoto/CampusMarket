<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>CampusMarket | Dashboard</title>

    <link rel="stylesheet" href="/css/styles.css">

    <script
            async
            crossorigin="anonymous"
            data-clerk-publishable-key="pk_test_ZnVubnktbXVza294LTU5LmNsZXJrLmFjY291bnRzLmRldiQ"
            src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@4/dist/clerk.browser.js">
    </script>
</head>
<body>

<div class="container">

    <h1>Dashboard</h1>

    <div id="user-section">

        <h2>
            Welcome,
            <span id="user-name"></span>
        </h2>

        <p id="user-email"></p>

        <button id="logout-button">
            Logout
        </button>

    </div>

</div>

<script>

    window.addEventListener("load", async () => {

        await Clerk.load();

        if (!Clerk.user) {

            window.location.href = "/sign-in";

            return;
        }

        document.getElementById("user-name").textContent =
            Clerk.user.fullName || "User";

        document.getElementById("user-email").textContent =
            Clerk.user.primaryEmailAddress.emailAddress;

        document
            .getElementById("logout-button")
            .addEventListener("click", async () => {

                await Clerk.signOut();

                window.location.href = "/";

            });

    });

</script>

</body>
</html>
