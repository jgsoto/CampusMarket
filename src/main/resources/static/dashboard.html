<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusMarket | Dashboard</title>

    <link rel="stylesheet" href="/css/styles.css">

    <script async crossorigin="anonymous"
        data-clerk-publishable-key="pk_test_ZnVubnktbXVza294LTU5LmNsZXJrLmFjY291bnRzLmRldiQ"
        src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@4/dist/clerk.browser.js">
        </script>
</head>

<body>

    <div class="container">

        <h1>Dashboard</h1>

        <div id="user-section" style="display: none;">

            <h2>
                Welcome,
                <span id="user-name"></span>
            </h2>

            <p id="user-email"></p>

            <p>
                Clerk ID:
                <span id="user-id"></span>
            </p>

            <button id="logout-button">
                Logout
            </button>

        </div>

        <hr style="margin: 20px 0;">

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0;">Catálogo de Productos</h2>

            <button onclick="window.location.href='/create-listing.html'"
                style="background: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
                + Vender Producto
            </button>
        </div>

        <div id="marketplace-section" style="display: none;">
            <div id="catalog-container" style="display: flex; gap: 15px; flex-wrap: wrap;">
                <p>Cargando productos...</p>
            </div>
        </div>

    </div>

    <script>

        window.addEventListener("load", async () => {

            await Clerk.load();

            if (!Clerk.user) {

                window.location.href = "/sign-in.html";

                return;
            }

            const token = await Clerk.session.getToken();

            try {

                const response = await fetch(
                    "http://localhost:8080/api/v1/users/sync",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            clerkUserId: Clerk.user.id,
                            fullName: Clerk.user.fullName,
                            email: Clerk.user.primaryEmailAddress.emailAddress
                        })
                    }
                );

                if (!response.ok) {

                    throw new Error("Failed to synchronize user");

                }

                const user = await response.json();


                localStorage.setItem("campusMarketUserId", user.id);

                console.log("User synchronized:", user);

            } catch (error) {

                console.error(error);

            }

            document.getElementById("user-section").style.display = "block";
            document.getElementById("marketplace-section").style.display = "block";
            loadCatalog();

            document.getElementById("user-name").textContent =
                Clerk.user.fullName || "User";

            document.getElementById("user-email").textContent =
                Clerk.user.primaryEmailAddress.emailAddress;

            document.getElementById("user-id").textContent =
                Clerk.user.id;

            document
                .getElementById("logout-button")
                .addEventListener("click", async () => {

                    await Clerk.signOut();

                    window.location.href = "/";

                });

        });

    </script>

    <script src="/js/marketplace.js"></script>

</body>

</html>
