<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusMarket | Dashboard</title>

    <link rel="stylesheet" href="/css/styles.css">

    <script async crossorigin="anonymous"
        data-clerk-publishable-key="pk_test_ZnVubnktbXVza294LTU5LmNsZXJrLmFjY291bnRzLmRldiQ"
        src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@4/dist/clerk.browser.js">
        </script>
</head>

<body>

    <div class="container">

        <h1>Dashboard</h1>

        <div id="user-section" style="display: none;">

            <h2>
                Welcome,
                <span id="user-name"></span>
            </h2>

            <p id="user-email"></p>

            <p>
                Clerk ID:
                <span id="user-id"></span>
            </p>

            <button id="logout-button">
                Logout
            </button>

        </div>

        <hr style="margin: 20px 0;">

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0;">Catálogo de Productos</h2>
            <div>
                <button onclick="window.location.href='/tutoring-catalog.html'"
                    style="background: #6f42c1; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 10px;">
                    📚 Módulo de Tutorías
                </button>
                <button onclick="window.location.href='/profile.html'"
                    style="background: #17a2b8; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 10px;">
                    👤 Mi Perfil
                </button>
                <button onclick="window.location.href='/my-listings.html'"
                    style="background: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 10px;">
                    Mis Publicaciones
                </button>
                <button onclick="window.location.href='/create-listing.html'"
                    style="background: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
                    + Vender Producto
                </button>
            </div>
        </div>


        <div id="marketplace-section" style="display: none;">
            <div id="catalog-container" style="display: flex; gap: 15px; flex-wrap: wrap;">
                <p>Cargando productos...</p>
            </div>
        </div>

    </div>

    <script src="/js/dashboard.js"></script>

    <script src="/js/marketplace.js"></script>

</body>

</html>
