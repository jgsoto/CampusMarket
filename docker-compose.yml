services:

  campusmarket-api:

    build: .

    container_name: campusmarket-api

    restart: always

    ports:
      - "8080:8080"
    env_file:
      - .env

  nginx:

    image: nginx:latest

    container_name: campusmarket-nginx

    restart: always

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/nginx/ssl:/etc/nginx/ssl:ro

    depends_on:
      - campusmarket-api